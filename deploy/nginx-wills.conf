# /etc/nginx/sites-available/wills.themuslimguide.org
#
# The old address. The site moved to https://wasiyyahwills.com on 2026-11-16
# (see nginx-wasiyyahwills.conf); this name now only redirects there, keeping
# the path, so old links and bookmarks still work. certbot manages the
# certificate lines and the port-80 block.
server {
    server_name wills.themuslimguide.org;

    return 301 https://wasiyyahwills.com$request_uri;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/wills.themuslimguide.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/wills.themuslimguide.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = wills.themuslimguide.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name wills.themuslimguide.org;
    return 404; # managed by Certbot


}
