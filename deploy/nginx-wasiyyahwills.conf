# /etc/nginx/sites-available/wasiyyahwills.com
#
# Wasiyyah is served on one address, https://wasiyyahwills.com (Next.js under
# PM2 on 127.0.0.1:3011). Every other name redirects to it: www, plain http,
# and wasiyyawills.com (the same name without the "h"). The old address,
# wills.themuslimguide.org, redirects from its own file (nginx-wills.conf).
#
# The certificates were issued with `certbot certonly --nginx`, one per domain,
# so either domain can lapse without breaking the other's renewal. certbot does
# not edit this file; a deploy hook reloads nginx after each renewal.

server {
    listen 443 ssl;
    server_name wasiyyahwills.com;

    ssl_certificate /etc/letsencrypt/live/wasiyyahwills.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wasiyyahwills.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}

server {
    listen 443 ssl;
    server_name www.wasiyyahwills.com;

    ssl_certificate /etc/letsencrypt/live/wasiyyahwills.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wasiyyahwills.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://wasiyyahwills.com$request_uri;
}

server {
    listen 443 ssl;
    server_name wasiyyawills.com www.wasiyyawills.com;

    ssl_certificate /etc/letsencrypt/live/wasiyyawills.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wasiyyawills.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://wasiyyahwills.com$request_uri;
}

server {
    listen 80;
    server_name wasiyyahwills.com www.wasiyyahwills.com wasiyyawills.com www.wasiyyawills.com;

    return 301 https://wasiyyahwills.com$request_uri;
}
